<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3b0, #ffd6e7, #d8ecff);
    }
    .card {
      width: min(90%, 720px);
      padding: 40px 24px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 4rem;
      color: #d63384;
    }
    p {
      font-size: 1.25rem;
      color: #444;
    }
    .picture {
      font-size: 7rem;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday!</h1>
    <div class="picture">🎈🎂🎁</div>
    <p>Wishing you a joyful day filled with smiles, laughter, and wonderful memories.</p>
    <p>🎉 Have a fantastic birthday celebration! 🎉</p>
  </div>
</body>
</html>
